<section class="quality-area" aria-label="GIF options"><div class="panel-title"><span><span class="muted">02 /</span> <span id="gif-options-title">TRIM &amp; CROP</span></span><span class="micro">.GIF</span></div><p id="crop-placeholder" class="option-note">Load an image or video to choose a crop.</p><div id="gif-editor" hidden>
<div id="gif-timing" class="option-grid"><label>START (SECONDS)<input id="gif-start" type="number" value="0" min="0" step="0.1"></label><label>LENGTH (SECONDS)<input id="gif-duration" type="number" value="5" min="0.1" max="30" step="0.1"></label></div>
<details id="gif-video-preview" class="video-preview-details"><summary>Preview video</summary><video id="source-preview" controls muted playsinline preload="metadata"></video><p id="preview-fallback" class="option-note" hidden>Your browser cannot play this source. You can still crop the frame below and set the trim times.</p></details>
<div class="crop-toolbar"><label for="crop-preset">CROP</label><select id="crop-preset"><option value="original">Full frame</option><option value="1">Square · 1:1</option><option value="1.7777777778">Landscape · 16:9</option><option value="0.5625">Portrait · 9:16</option><option value="1.3333333333">Classic · 4:3</option><option value="free">Custom</option></select><button id="reset-crop" class="text-button">Reset</button></div>
<div id="crop-stage" class="crop-stage"><img id="crop-image" alt="Video frame for crop selection" draggable="false"><div id="crop-box" class="crop-box" role="group" aria-label="Crop selection"><span id="crop-handle" class="crop-handle" aria-hidden="true"></span></div></div>
<p id="crop-status" class="option-note" role="status"></p>
<p class="option-note">Drag the box to move it; drag its corner to resize. Exact values below.</p>
<div class="option-grid crop-fields"><label>X<input id="crop-x" type="number" min="0" step="1"></label><label>Y<input id="crop-y" type="number" min="0" step="1"></label><label>WIDTH<input id="crop-width" type="number" min="1" step="1"></label><label>HEIGHT<input id="crop-height" type="number" min="1" step="1"></label></div>
</div><div class="option-grid"><label>OUTPUT WIDTH<select id="gif-width"><option value="240">240 px</option><option value="480" selected>480 px</option><option value="720">720 px</option><option value="960">960 px</option><option value="1280">1280 px</option></select></label><label id="gif-frame-rate">FRAME RATE<select id="gif-fps"><option value="10">10 fps</option><option value="15" selected>15 fps</option><option value="24">24 fps</option><option value="30">30 fps</option><option value="50">50 fps · Smooth</option></select></label></div><p id="gif-note" class="option-note">Up to 30 seconds · Loops continuously · No audio.</p></section>
