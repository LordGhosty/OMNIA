<details class="media-editing"><summary>Editing tools</summary><p class="option-note">Edits are applied to the new file. The original stays unchanged.</p><div class="option-grid audio-trim"><label>START (SECONDS)<input id="edit-start" type="number" min="0" step="0.1" value="0"></label><label>LENGTH (SECONDS)<input id="edit-duration" type="number" min="0" step="0.1" value="0"><small>0 = to the end</small></label></div><div class="option-grid"><label>SPEED<select id="edit-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Original · 1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>VOLUME (dB)<input id="edit-volume" type="number" min="-30" max="12" step="1" value="0"></label><label>FADE IN (SECONDS)<input id="edit-fadeIn" type="number" min="0" max="30" step="0.1" value="0"></label><label>FADE OUT (SECONDS)<input id="edit-fadeOut" type="number" min="0" max="30" step="0.1" value="0"></label></div><p class="option-note">Speed keeps the audio pitch. Fades use the edited output duration. Positive gain can cause clipping.</p><audio id="audio-source-preview" class="audio-preview" controls preload="metadata" hidden></audio></details>
